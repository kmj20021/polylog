# polylog 로컬 실행 — `docker compose up -d --build` 한 번으로 전부 뜬다.
#   api       : 기존 Lambda 핸들러를 감싼 서버 (http://localhost:8000)
#   dynamodb  : DynamoDB 대체 (데이터는 ddb-data 볼륨에 보존)
#   (S3 는 대체하지 않음 — 앱이 원본 사진을 다시 쓰지 않고, 저장 실패는 핸들러가 무시한다)
#   litellm   : LLM 게이트웨이 대체 (본인 API 키 사용)
#   init      : 테이블 생성 후 종료되는 1회성 작업
# 키는 같은 폴더의 .env 에서 읽는다(.env.example 참고, .env 는 커밋 금지).

x-aws-local: &aws-local
  AWS_ACCESS_KEY_ID: polylog
  AWS_SECRET_ACCESS_KEY: polylog-local-secret
  AWS_DEFAULT_REGION: ap-northeast-2
  AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb:8000

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      <<: *aws-local
      LLM_BASE_URL: http://litellm:4000
      LLM_API_KEY: ${LITELLM_MASTER_KEY}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY}
      EXCHANGE_RATE_API_KEY: ${EXCHANGE_RATE_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
    depends_on:
      init:
        condition: service_completed_successfully
      litellm:
        condition: service_started
    restart: unless-stopped

  dynamodb:
    image: amazon/dynamodb-local:2.5.2
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /data
    user: root
    volumes:
      - ddb-data:/data
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: --config /app/config.yaml --port 4000
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
    volumes:
      - ./docker/litellm-config.yaml:/app/config.yaml:ro
    restart: unless-stopped

  init:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python /app/init-resources.py
    environment:
      <<: *aws-local
    volumes:
      - ./docker/init-resources.py:/app/init-resources.py:ro
    depends_on:
      - dynamodb
    restart: on-failure

volumes:
  ddb-data:
